<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0d" />
    <meta name="description" content="Acacia — designed for the quiet. Mobiliario moderno minimalista en nogal, acero y luz ámbar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" />
    <title>Acacia · designed for the quiet</title>
  </head>
  <body>
    <script>
      // Aplica el tema antes de pintar para evitar flash.
      (function () {
        try {
          var stored = localStorage.getItem('acacia-theme');
          var theme  = (stored === 'dark' || stored === 'light')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
